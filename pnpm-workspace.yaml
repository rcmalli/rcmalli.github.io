# pnpm settings — applies even when this isn't a monorepo

# 7-day security gate: blocks installation of any package version younger
# than 7 days (10080 minutes). Defense against freshly-published malicious
# package versions; most attacks get caught and pulled within a few days.
# Override per-package with minimumReleaseAgeExclude if needed.
minimumReleaseAge: 10080

# Approved post-install scripts. Both are legitimate native deps required
# by Astro: esbuild for the transformer, sharp for image optimization.
allowBuilds:
  esbuild: true
  sharp: true

# Force-resolve vulnerable transitive deps to patched versions.
# Each entry below corresponds to one or more open Dependabot alerts on
# transitive dependencies that we can't reach via our direct dep ranges.
# Subrange selectors (e.g. picomatch@2) target a specific major line so
# we don't break consumers pinned to an older API.
overrides:
  defu: ^6.1.5
  devalue: ^5.6.4
  diff: ^5.2.2
  h3: ^1.15.9
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  postcss: ^8.5.10
  rollup: ^4.59.0
  smol-toml: ^1.6.1
  svgo@3: ^3.3.3
  svgo@4: ^4.0.1
  tar: ^7.5.11
  undici: ^7.24.0
  vite: ^7.3.3
